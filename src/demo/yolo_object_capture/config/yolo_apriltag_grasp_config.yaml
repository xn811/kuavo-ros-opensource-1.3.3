# yolo_apriltag_grasp 配置文件
# 用法: python3 yolo_apriltag_grasp.py

# AprilTag ID
tag_id: 1

# YOLOv8目标ID (39=瓶子, 41=杯子)
target_id: 39

# 使用的手: left/right/auto
hand: "right"

# ==================== 导航位置参数 ====================
# 物品相对机器人的横向偏移 (正=机器人右边，负=机器人左边，单位m)
lateral_offset: 1

# 抓取时距离物品的距离 (m)
grasp_offset: 0.275

# 放置点相对机器人的横向偏移 (正=机器人右边，负=机器人左边，单位m)
place_lateral_offset: -0.5

# 放置时距离目标的距离 (m)
place_offset: 0.25

# 放置后后退距离 (m)
backward_distance: 0.5

# ==================== 抓取手部偏移量 ====================
# 用于补偿视觉检测与实际抓取位置的误差
# 以右手为例，机器人面朝方向为前方:
#   - 若抓取点偏上，则降低 offset_z 的值，反之则调高
#   - 若抓取点偏右，则增大 temp_y_r 的值，反之则降低
#   - 若抓取点偏前，则降低 temp_x_r 的值，反之则调高

# Z轴偏移 (高度方向，默认抓取点在检测点正下方，因此为负值)
offset_z: -0.013

# 左手X轴偏移 (前后方向)
temp_x_l: -0.016

# 左手Y轴偏移 (左右方向，左手为正值，左加)
temp_y_l: 0.038

# 右手X轴偏移 (前后方向)
temp_x_r: 0.055

# 右手Y轴偏移 (左右方向，右手为正值，右减)
temp_y_r: 0.128

# Z轴角度偏移量缩放倍率
# 在进行IK求解时，若觉得yaw角不符合预期，可适当增加或降低该值
offset_angle: 1.00
