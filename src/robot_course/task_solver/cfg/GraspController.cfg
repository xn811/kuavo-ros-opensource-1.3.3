#!/usr/bin/env python
PACKAGE = "task_solver"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# 滑动窗口滤波
gen.add("depth_sample_radius", int_t, 0, "滑动窗口大小(帧数)", 5, 1, 20)

# 桌面高度过滤参数
gen.add("table_height_enabled", bool_t, 0, "启用桌面高度过滤", True)
gen.add("table_height", double_t, 0, "桌面高度(m)", 0.8, 0.0, 2.0)
gen.add("table_height_tolerance", double_t, 0, "桌面高度容差(m)", 0.15, 0.01, 0.5)

exit(gen.generate(PACKAGE, "grasp_controller", "GraspController"))
